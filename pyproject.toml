[project]
name = "mosaic"
version = "0.1.0"
description = "composite objective protein design"
readme = "README.md"
authors = [
    { name = "Nick Boyd", email = "nick@escalante.bio" }
]
requires-python = "==3.12.*"
dependencies = [
    "equinox>=0.13.0",
    "gemmi>=0.6.5",
    "httpx>=0.28.1",
    "ipymolstar>=0.0.9",
    "jax>=0.11.1",
    "jfold",
    "marimo>=0.10.9",
    "matplotlib>=3.10.0",
    "numpy>=2.1",
    "optax>=0.2.4",
    "scipy>=1.15.1",
]

# One extra per model that needs more than jfold. A structure model's extra holds its
# upstream package, for `featurization="upstream"` (inputs jfold's views do not take:
# DNA/RNA, ligands, paired MSAs). torch is named where it is needed so it resolves from
# the CPU index below.
[project.optional-dependencies]
boltz2 = ["boltz", "torch==2.11.0"]
protenix = ["protenix"]
openfold3 = ["jopenfold3", "torch==2.11.0"]
mol1 = ["molence", "torch==2.11.0"]
# tinyprot: ProMERA's featurizer, and its taxonomy database for MSA pairing.
promera = ["tinyprot"]
bioemu2 = ["bioemu2", "torch==2.11.0"]
af2 = ["biopython", "dm-haiku>=0.0.13", "dm-tree", "ml-collections>=1.0.0", "tqdm"]
boltzgen = ["boltzgen", "joltzgen", "polars>=1.37.1", "torch==2.11.0"]
proteina = ["jproteina-complexa"]
rfd4 = ["jrfd4-proteina[convert]", "rfd4-proteina", "torch==2.11.0"]
ablang = ["ablang>=0.3.1", "jablang", "torch==2.11.0"]
esm2 = ["esm2quinox>=0.2.0", "fair-esm", "torch==2.11.0"]
all = [
    "mosaic[boltz2,protenix,openfold3,mol1,promera,bioemu2,af2,boltzgen,proteina,rfd4,ablang,esm2]",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]
jax-cpu = [
  "jax[cpu]",
]
jax-cuda = [
  "jax[cuda12]",
  "nvidia-cublas-cu12>=12.9.1.4",
  "nvidia-cusolver-cu12==11.7.3.90",
]
jax-tpu= [
  "jax[tpu]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/mosaic/proteinmpnn/weights/*/*",
    "src/mosaic/data/*",
]
# ProteinMPNN's torch checkpoints: only `mosaic.proteinmpnn.convert` reads them, from the
# repository; mosaic loads the converted copies beside them.
exclude = ["src/mosaic/proteinmpnn/weights/*.pt"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
protenix = { git = "https://github.com/escalante-bio/protenij"}
jablang = { git = "https://github.com/escalante-bio/jablang" }
joltzgen = { git = "https://github.com/escalante-bio/joltzgen.git" }
jopenfold3 = { git = "https://github.com/escalante-bio/jopenfold3.git" }
jproteina-complexa = { git = "https://github.com/escalante-bio/jproteina-complexa.git" }
boltz = { git = "https://github.com/escalante-bio/boltz.git" }
boltzgen = { git = "https://github.com/escalante-bio/boltzgen.git" }
jrfd4-proteina = { git = "https://github.com/nboyd/jrfd4-proteina.git" }
# Fork relaxing the huggingface-hub>=1.0 floor.
rfd4-proteina = { git = "https://github.com/escalante-bio/RFD4-Proteina.git" }
# Fork relaxing pins (biotite, biopython, modelcif, protobuf) that conflict with boltz,
# protenix and rfd4-proteina.
molence = { git = "https://github.com/escalante-bio/Mol-1" }
bioemu2 = { git = "https://github.com/microsoft/bioemu2", rev = "06be369dd555849165a737472d42d936959e46fc" }
jfold = { git = "https://github.com/escalante-bio/jfold.git" }
tinyprot = { git = "https://github.com/bjing2016/tinyprot.git" }

[tool.ruff.lint]
ignore = ["F722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "model_smoke: loads real checkpoints and exercises model featurization",
    "model_forward: runs model output, prediction, and loss forwards",
    ]
addopts = "-m 'not slow'"

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [
    [
      { group = "jax-cpu" },
      { group = "jax-cuda" },
      { group = "jax-tpu" },
    ],
]
package = true

